<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Parichay</title>
    <style>
        body {
            background-color: #050510;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 { font-weight: 900; letter-spacing: -0.05em; margin-bottom: 10px; }
        p { color: #888; font-size: 14px; max-width: 280px; }
        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #3B82F6, #1E40AF);
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 24px;
        }
        .btn {
            margin-top: 30px;
            padding: 12px 24px;
            background: #3B82F6;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">P</div>
        <h1>YOU ARE OFFLINE</h1>
        <p>Your business network is still here. Check your connection to access the live dashboard and cards.</p>
        <a href="javascript:window.location.reload()" class="btn">RETRY CONNECTION</a>
    </div>
</body>
</html>
